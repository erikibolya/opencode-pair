[project]
name = "opencode-pair"
version = "0.2.0"
description = "Pairing QR code web page for a self-hosted OpenCode server"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "E501",   # long HTML/CSS template lines are intentional
  "RUF001", # czech characters in the page
  "RUF002",
  "RUF003",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["qrcode.*"]
ignore_missing_imports = true
